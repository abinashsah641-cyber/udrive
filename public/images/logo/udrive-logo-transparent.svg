<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="40%" stop-color="#FFD83D"/>
      <stop offset="100%" stop-color="#DDA600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#28618F"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="carAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  

  <g transform="translate(25, 20)">
    <!-- Emblem: Gold Stylized U with Automotive Blue Car Silhouette -->
    <g transform="translate(15, 10)" filter="url(#dropGlow)">
      <!-- The Bold Gold U -->
      <path d="M 20 20 L 52 20 C 52 65 65 110 100 110 C 135 110 148 65 148 20 L 180 20 C 180 85 155 140 100 140 C 45 140 20 85 20 20 Z" 
            fill="url(#goldGrad)"/>

      <!-- Sleek Automotive-Blue Car Silhouette Crossing the U -->
      <!-- Speedline / Road trail -->
      <path d="M 0 100 Q 40 98 85 96 Q 130 94 195 90" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 10 108 Q 50 106 100 104 Q 150 102 205 98" stroke="#FFD83D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Sports Car Body Profile -->
      <path d="M 12 92 
               C 35 90 55 88 70 78 
               C 85 68 105 52 135 52 
               C 155 52 175 66 186 78 
               C 192 84 202 87 210 88 
               C 212 90 210 93 205 94 
               C 188 95 182 86 168 86 
               C 154 86 150 96 135 96 
               C 95 96 90 86 75 86 
               C 60 86 55 95 38 95 
               C 25 95 16 93 12 92 Z" 
            fill="url(#blueGrad)"/>

      <!-- Roof glass & aerodynamics -->
      <path d="M 82 74 C 95 62 110 57 132 57 C 148 57 162 66 172 74 Z" fill="#080A0D" opacity="0.75"/>
      <path d="M 88 72 C 98 63 110 60 128 60 C 142 60 155 66 164 72 Z" fill="url(#carAccent)" opacity="0.9"/>

      <!-- Wheels (Stylized Dark/Gold Alloys) -->
      <circle cx="55" cy="92" r="11" fill="#080A0D" stroke="url(#blueGrad)" stroke-width="3"/>
      <circle cx="55" cy="92" r="4" fill="#FFD83D"/>
      <circle cx="162" cy="88" r="11" fill="#080A0D" stroke="url(#blueGrad)" stroke-width="3"/>
      <circle cx="162" cy="88" r="4" fill="#FFD83D"/>
    </g>

    <!-- Brand Typography & Tagline -->
    <g transform="translate(250, 45)">
      <!-- U DRIVE Main Wordmark -->
      <text x="0" y="46" font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="4" fill="#FFFFFF">
        <tspan fill="url(#goldGrad)">U</tspan> DRIVE
      </text>

      <!-- Badge: NEPAL / RENTAL SERVICE -->
      <rect x="0" y="66" width="130" height="18" rx="4" fill="#28618F" opacity="0.3"/>
      <rect x="0" y="66" width="130" height="18" rx="4" stroke="#28618F" stroke-width="1" fill="none"/>
      <text x="65" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#38BDF8" text-anchor="middle">
        PREMIUM RENTALS
      </text>

      <!-- Official Tagline: Every Ride A New Story -->
      <text x="0" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="600" letter-spacing="1.2" fill="#A0AAB8">
        <tspan fill="#FFD83D" font-weight="700">Every Ride</tspan> A <tspan fill="#60A5FA" font-weight="700">New Story</tspan>
      </text>
    </g>
  </g>
</svg>